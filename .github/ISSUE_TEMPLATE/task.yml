name: 작업 요청
description: 담당 영역과 완료 조건이 있는 작은 작업
title: "[작업] "
body:
  - type: dropdown
    id: area
    attributes:
      label: 담당 영역
      options:
        - 백엔드 B
        - 프론트엔드 A
        - 기획
        - 디자인
        - A/B 공동
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 누가 어떤 상황에서 겪는 문제인지 적습니다.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 실제로 확인할 수 있는 결과를 체크리스트로 적습니다.
      placeholder: "- [ ] 정상 상태 확인\n- [ ] 실패 상태 확인"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 수정 범위와 협의 사항
      description: 관련 파일, API 요청·응답 예시, 다른 담당자에게 필요한 내용을 적습니다.
  - type: textarea
    id: validation
    attributes:
      label: 검증 방법
      description: 검사 명령과 수동 확인 방법. 학교 비밀번호나 원본 LMS 파일을 올리지 않습니다.
    validations:
      required: true
