name: Refresh department graduation rules

on:
  schedule:
    # 04:30 KST daily; separate from the activities and schedule refresh.
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh-dept-rules
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HANSUNG_D1_DATABASE_ID: ${{ secrets.HANSUNG_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Load the current published rules baseline
        run: node scripts/_dept_rules_baseline.mjs
      - name: Collect complete department rules
        run: node --experimental-strip-types scripts/crawl-dept-rules.mts
      - name: Build generated Wrangler config
        run: npm run build
      - name: Publish department rules only
        run: node scripts/_publish_snapshots.mjs --remote --only=dept-rules
      - name: Verify department rules freshness
        run: python scripts/_verify_snapshots.py --only=/api/dept-rules --match-local
      - name: Open or update the alert issue
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_NAME: Department graduation rules refresh
          MONITOR_RESULT: failure
        run: python scripts/_notify_monitor.py
      - name: Close the alert issue after recovery
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MONITOR_NAME: Department graduation rules refresh
          MONITOR_RESULT: success
        run: python scripts/_notify_monitor.py
