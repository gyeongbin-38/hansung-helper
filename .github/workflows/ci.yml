name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck, lint, unit and SQLite checks, production build
        run: npm run verify
      - name: Apply local D1 migrations and check repeatability
        run: |
          npm run db:migrate:local
          npm run db:migrate:local
