name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Typecheck, lint, unit and SQLite checks, production build
        run: npm run verify
      - name: Python operation tests
        run: |
          python3 tests/monitor-alert.test.py
          python3 tests/verify-prod.test.py
      - name: Apply local D1 migrations twice
        run: |
          npm run db:migrate:local
          npm run d1:migrate:local
      - name: Verify local snapshot publication and backup use the migrated database
        run: |
          node scripts/_publish_snapshots.mjs --local
          npm run d1:backup:local
          grep -q 'academic_accounts' .d1-backups/*.sql
          grep -q 'public_snapshots' .d1-backups/*.sql
